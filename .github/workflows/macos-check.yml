name: macOS check

# macOS 移植的**编译反馈回路**（阶段 0）。
#
# 为什么需要它：mac 平台分支（`#[cfg(target_os = "macos")]`）在 Windows 上编不了，
# 手上又没有 Mac。没有这个 workflow，每一行 mac 代码都只是「我说它能编译」——
# 而本项目的验收纪律（docs/14 第七节、memory `verification-discipline`）明确
# 禁止把未验证的东西报成完成。有了它，mac 分支的编译与单测都是可证伪的。
#
# 刻意**不做**的事：不出安装包、不签名、不公证。那些属阶段 3，另开 workflow。
# 这里只回答一个问题：mac 上编得过吗、单测过几条。

on:
  push:
    branches: [master]
    paths:
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/macos-check.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - "src/**"
      # 必须带上本文件：否则「只改 workflow」的 PR 不会触发它自己，
      # 改动无从验证（本 workflow 首次落地就是这种 PR）。
      - ".github/workflows/macos-check.yml"
  # 阶段 0 摸基线全靠手动触发
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # macos-latest 现为 arm64（Apple Silicon），即主目标平台。
    # x86_64 (macos-13) 待阶段 3 出双架构包时再加 matrix。
    runs-on: macos-latest

    steps:
      # v4 的**动作运行时**是 Node 20，已弃用（runner 强制拉到 Node 24 并每跑必告警）。
      # v5 起官方切到 node24。v7 是当前最新，从 v4 跳过来的两处判据都已核过：
      # - 最低 runner 版本 v2.327.1：GitHub 托管 runner 早已超过（告警本身就说明它在跑 Node 24）
      # - v7 新增「阻止 fork PR 检出」只作用于 pull_request_target / workflow_run，本仓两个
      #   workflow 都不用这两个事件
      - uses: actions/checkout@v7

      # setup-node v5 起：`package.json` 里有 `packageManager` 字段时会**自动**开缓存
      # （v6 又把自动缓存收窄到只对 npm）。本仓根与 site 两个 package.json 都没有该字段，
      # 故行为不变；下面 `cache: npm` 是显式指定，v7 仍支持。
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 用 ci 而不是 install：锁文件对不上直接失败，不悄悄装成另一套版本
      - name: Install frontend deps
        run: npm ci

      # 必须先出 dist/：lib.rs 的 `tauri::generate_context!()` 要嵌入 frontendDist
      # （tauri.conf.json 指向 ../dist），目录不存在则编译期报错。
      # 副产物：这一步同时在 macOS 上跑了 tsc（package.json 的 build = tsc && vite build）。
      - name: Build frontend (dist/ 是 generate_context! 的前置)
        run: npm run build

      # `--locked`：Cargo.lock 已入库，CI 必须按它解析。少了这个标志，cargo 会在
      # 版本可升时**改写 Cargo.lock**，于是最后那步 `git diff --quiet` 红在一个
      # 与 mac 毫无关系的原因上（而且看起来像「故障注入没复原」，最难查的那种误报）。
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked --lib --all-targets

      # 与本项目既有基线口径一致（CLAUDE.md：`cargo clippy --lib --all-targets` 零警告）。
      # 暂不加 `-D warnings`：先看 macOS 上有没有 Windows 上看不见的警告，
      # 清完再收紧（收紧动作记在 docs 的 mac 移植笔记里）。
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --lib --all-targets

      # 与既有基线同一条命令（CLAUDE.md：`cargo test --lib`）。
      # continue-on-error：阶段 0 的目的是**取到数字**，不是一红了之——
      # 真正的红/绿判定交给下一步，它会把通过数写进 Step Summary 再决定退出码。
      - name: cargo test --lib
        id: unit
        working-directory: src-tauri
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test --locked --lib --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Report baseline
        working-directory: src-tauri
        run: |
          log="$RUNNER_TEMP/test.log"
          {
            echo "## macOS 单测基线"
            echo
            echo '```'
            grep -E "^test result:" "$log" || echo "(未取到 test result 行)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          failed=$(grep -oE "[0-9]+ failed" "$log" | grep -oE "[0-9]+" | awk '{s+=$1} END {print s+0}')
          passed=$(grep -oE "[0-9]+ passed" "$log" | grep -oE "[0-9]+" | awk '{s+=$1} END {print s+0}')
          echo "macOS 基线: $passed passed / $failed failed"
          if [ "$passed" -eq 0 ]; then
            echo "::error::一条测试都没跑起来 —— 大概率是编译失败，不是「全绿」"
            exit 1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "::error::macOS 上有 $failed 条测试失败"
            exit 1
          fi

      # ---- 故障注入自检 ----
      #
      # 这一步回答「本 workflow 到底证明了什么」。上面全绿有两种可能：
      # (a) mac 分支真的编译通过了；(b) mac 分支压根没被编译，绿是假的。
      # 往源码里塞一个**只在 macOS 下存在**的类型错误即可区分：cargo check 必须变红，
      # 且必须是因为这个错误变红。与项目里三道路径防线的验证手法同源
      # （去掉防线测试必须变红，见 agent_tools.rs 模块注释）。
      - name: Fault-injection self-check
        working-directory: src-tauri
        run: |
          probe='
          #[cfg(target_os = "macos")]
          fn _synaroute_ci_fault_probe() -> u32 { "not a u32" }
          '
          printf '%s\n' "$probe" >> src/proc.rs

          if cargo check --locked --lib > "$RUNNER_TEMP/probe.log" 2>&1; then
            git checkout -- src/proc.rs
            echo "::error::注入的 mac 专属故障未被发现 —— mac 分支未被编译，本 workflow 证明不了任何事"
            exit 1
          fi

          if ! grep -qE "_synaroute_ci_fault_probe|mismatched types" "$RUNNER_TEMP/probe.log"; then
            git checkout -- src/proc.rs
            echo "::error::cargo check 确实失败了，但不是因为注入的故障 —— 判据不成立"
            cat "$RUNNER_TEMP/probe.log"
            exit 1
          fi

          git checkout -- src/proc.rs
          echo "故障注入已被 cargo check 抓到，且原因正确 ✓"

      # ---- .app 产出与 Info.plist 判据 ----
      #
      # 为什么必须真出包：`bundle.macOS.minimumSystemVersion` 加在配置里是「看起来配了」，
      # 而它到底有没有落进 Info.plist 的 LSMinimumSystemVersion，只有产物能证明。
      # 本项目历史上栽在同一形态两次（FR-025 自启动开关字段存在、UI 能点、值落盘，
      # 后端却从无注册代码；Tailwind 的 bg-warning/8 不在标度内→一条 CSS 都不生成）。
      #
      # 同时出 `dmg`：它是给人装的形态，且 dmg 那条打包路径（挂载磁盘映像、摆图标、
      # 卸载）在 CI 上偶发失败，不跑就等于没验过 —— 而真机验证时若 dmg 本身有问题，
      # 会被误当成「应用有问题」排查半天。
      #
      # `--bundles app,dmg` 而不是把它们写进 tauri.conf.json 的 targets：
      # bundler 的 `PackageType::Nsis` 那条 match 臂**没有 cfg 门控**
      # （源码注释：don't restrict to windows as NSIS installers can be built in
      # linux+macOS using cargo-xwin），配置里混列会让 mac 构建真去跑 NSIS。
      #
      # `app` 必须显式列出：bundler 在 `!package_types.contains(&MacOsBundle)` 时
      # 会把 .app 当中间产物删掉（源码 tb.rs 的 "Clean up .app if only building dmg"），
      # 而下面四条判据全靠读 .app 里的文件。
      - name: Build .app and verify bundle
        run: |
          npm run tauri build -- --bundles app,dmg 2>&1 | tail -30

          APP="src-tauri/target/release/bundle/macos/SynaRoute.app"
          if [ ! -d "$APP" ]; then
            echo "::error::.app 未产出，预期路径 $APP"
            ls -R src-tauri/target/release/bundle 2>/dev/null || true
            exit 1
          fi
          echo "产物: $APP"

          PLIST="$APP/Contents/Info.plist"

          # 判据 1：minimumSystemVersion 真的落进了 Info.plist
          got=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$PLIST" 2>/dev/null || echo "<缺失>")
          echo "LSMinimumSystemVersion = $got"
          if [ "$got" != "11.0" ]; then
            echo "::error::tauri.conf.json 配了 minimumSystemVersion=11.0，产物里却是 '$got' —— 配置未生效"
            exit 1
          fi

          # 判据 2：icns 由 PNG 自动生成（icon 数组里没有 .icns，靠 bundler 现场打包）
          if ! ls "$APP/Contents/Resources/"*.icns >/dev/null 2>&1; then
            echo "::error::Resources 下无 .icns —— 图标未被打包，Dock/Finder 会显示默认图标"
            ls -la "$APP/Contents/Resources/" || true
            exit 1
          fi
          echo "icns 已生成 ✓"

          # 判据 3：可执行文件是 arm64（macos-latest 是 Apple Silicon）
          arch=$(lipo -archs "$APP/Contents/MacOS/SynaRoute" 2>/dev/null || echo "?")
          echo "可执行架构 = $arch"
          case "$arch" in
            *arm64*) ;;
            *) echo "::error::预期 arm64，实际 '$arch'"; exit 1;;
          esac

          # 判据 4：前端资源真被嵌入（对齐 CLAUDE.md 的硬规则 —— 裸 cargo build 该值为 0）
          n="(未检)"
          chunk=$(ls dist/assets/*.js 2>/dev/null | head -1 | xargs -r basename)
          if [ -n "$chunk" ]; then
            n=$(grep -c "$chunk" "$APP/Contents/MacOS/SynaRoute" 2>/dev/null || echo 0)
            echo "chunk '$chunk' 在二进制里出现 $n 次"
            if [ "$n" -eq 0 ]; then
              echo "::error::前端资源未嵌入产物 —— 运行时会去连 devUrl 打不开界面"
              exit 1
            fi
          else
            echo "::warning::dist/assets 下没找到 js chunk，跳过嵌入判据"
          fi

          # 判据 5：dmg 真的产出了（挂载/摆位/卸载那条路径能跑通）
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::dmg 未产出 —— dmg 打包路径失败（挂载磁盘映像在 CI 上偶发失败）"
            ls -R src-tauri/target/release/bundle 2>/dev/null || true
            exit 1
          fi
          dmg_size=$(du -h "$DMG" | cut -f1)
          echo "dmg 产出: $DMG ($dmg_size)"

          {
            echo "### macOS 产物判据"
            echo "- LSMinimumSystemVersion: \`$got\`"
            echo "- icns: 已生成"
            echo "- 架构: \`$arch\`"
            echo "- 前端嵌入: 命中 $n 次"
            echo "- dmg: \`$(basename "$DMG")\` ($dmg_size)"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- 打包产物供下载（真机验证用）----
      #
      # **.app 必须先 tar**：`actions/upload-artifact` 不保留 POSIX 权限，也不保留符号链接
      # （它内部先 zip，而 zip 那套元数据模型装不下 unix mode 位）。而 .app 靠两样东西才能跑：
      #   1. `Contents/MacOS/SynaRoute` 的可执行位；
      #   2. `Contents/Frameworks` 里的符号链接（WebView 等框架的版本化布局）。
      # 直接上传的结果是下载下来双击毫无反应 —— 且不报任何错，正是本项目最防的静默失效形态。
      #
      # dmg 是单个二进制文件、内部结构由磁盘映像自己承载，不受此影响，直接传即可。
      - name: Package artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"

          # -C 进到 bundle/macos 再打包，让 tar 里的路径是 `SynaRoute.app/...`
          # 而不是一长串 src-tauri/target/release/bundle/macos/。
          tar -czf "$RUNNER_TEMP/artifacts/SynaRoute-macos-arm64-app.tar.gz" \
            -C src-tauri/target/release/bundle/macos SynaRoute.app

          cp src-tauri/target/release/bundle/dmg/*.dmg "$RUNNER_TEMP/artifacts/"

          # 自检：把 tar **真解一次**，对解出来的文件判可执行位。
          #
          # 上一版这里是 `tar -tvf | grep ... | awk '{print $1}'`，即解析 tar 的文本列表。
          # 它在 macOS runner 上取到**空字符串** → 自检误红，而 tar 本身是好的
          # （bsdtar 的 -tv 列表格式或输出流与我预期不符，根因未查）。
          #
          # 不去查那个根因，而是换判据：要证的命题是「解开后能不能跑」，
          # 正确判法就是解开再 `test -x`，不是对一行文本做模式匹配。
          # 文本解析这类间接判据一旦不匹配，失败方向是「静默取空」而非报错 ——
          # 恰好是本项目反复防的形态，这次栽在我自己写的判据上。
          probe="$RUNNER_TEMP/extract-probe"
          rm -rf "$probe"
          mkdir -p "$probe"
          tar -xzf "$RUNNER_TEMP/artifacts/SynaRoute-macos-arm64-app.tar.gz" -C "$probe"

          # 顺带把 tar 列表的头几行打出来，供下次排查时知道真实格式（含 stderr）。
          echo "--- tar -tvf 前 3 行（诊断用）---"
          tar -tvf "$RUNNER_TEMP/artifacts/SynaRoute-macos-arm64-app.tar.gz" 2>&1 | head -3
          echo "---"

          exe="$probe/SynaRoute.app/Contents/MacOS/SynaRoute"
          if [ ! -f "$exe" ]; then
            echo "::error::解开后找不到主可执行文件，预期 $exe"
            find "$probe" -maxdepth 4 | head -30
            exit 1
          fi
          if [ ! -x "$exe" ]; then
            echo "::error::解开后主可执行文件没有可执行位 —— 双击不会有任何反应"
            ls -l "$exe"
            exit 1
          fi
          echo "解开后可执行位保留 ✓"
          ls -l "$exe"

          # 符号链接数只报不判：Tauri 的 .app 未必含 Frameworks，为零不代表错。
          # 记它是为了将来若加了框架依赖，能看出 tar 是否把链接原样带过来了。
          links=$(find "$probe/SynaRoute.app" -type l | wc -l | tr -d ' ')
          echo "符号链接数: $links"

          rm -rf "$probe"
          echo "--- 待上传产物 ---"
          ls -lh "$RUNNER_TEMP/artifacts/"

      # v7 而非 v4：v4 的运行时是 Node 20（已弃用），会把本 workflow 前面刚清掉的
      # 那条弃用告警重新引回来。v5→v7 的「破坏性变更」实际只有运行时升 Node 24 +
      # 最低 runner 2.327.1 两条，GitHub 托管 runner 早已满足（本 job 跑在 macos-26）。
      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-build
          path: ${{ runner.temp }}/artifacts/*
          # 真机验证是一次性动作，不需要长期留存；短期限也免得占仓库配额。
          retention-days: 14
          # 产物缺失应当是**红**而不是静默传个空包 —— 与本项目其它判据同一态度。
          if-no-files-found: error

      # 判据刻意用 `git diff`（只看**已跟踪**文件）而不是 `git status --porcelain`：
      # 前面的 npm ci / npm run build 会产出 node_modules 与 dist（均已 gitignore），
      # 用 status 会把它们当成「未复原」误红。cargo 那边加了 `--locked`，Cargo.lock 不会被改写。
      - name: Verify working tree restored
        run: |
          if ! git diff --quiet; then
            echo "::error::故障注入后工作区未复原"
            git diff --stat
            exit 1
          fi
          echo "工作区已复原 ✓"
