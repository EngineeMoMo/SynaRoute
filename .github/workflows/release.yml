name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  quality:
    permissions:
      contents: read
    uses: ./.github/workflows/gates.yml

  create-release:
    needs: quality
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}

    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: get version
        run: echo "PACKAGE_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
      - name: create release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const tag_name = `v${process.env.PACKAGE_VERSION}`
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            })
            const existing = releases.find((release) => release.tag_name === tag_name)
            if (existing) {
              if (!existing.draft) {
                throw new Error(`Release ${tag_name} already exists and is published; refusing to create a duplicate.`)
              }
              core.info(`Reusing existing draft release ${existing.id} for ${tag_name}.`)
              return existing.id
            }

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name,
              name: `SynaRoute ${tag_name}`,
              // 说明里必须带「v0.1.23 及更早请手动重装」那一段。
              // 官网下载页也有同样一条，但那两条渠道触达的是不同的人 ——
              // 从 Release 页直接下包的人根本不会经过官网。
              // 而这批用户是**收不到任何应用内更新**的（换钥导致旧公钥验不过新签名），
              // 也就永远看不到我们在新版里改好的那句错误文案。这是少数能触达他们的地方。
              body: [
                'Download the installer for your platform from the assets below.',
                '',
                '**v0.1.84 — Security hardening and single-Key conversation tests.**',
                '安全修复与单 Key 多轮会话测试。',
                'Portable backup v4 authenticates the configuration together with encrypted credentials. Legacy encrypted backups require explicit risk confirmation; imports refuse to rebind existing local credentials to changed targets.',
                '可移植备份升级为 v4，将配置与加密凭据一并认证；旧加密备份需明确确认风险后导入，拒绝把本机已有凭据重新绑定到改变后的目标。',
                'Blocks VCS-directory symlink aliases in file, image and retrieval tools. MCP respects the detailed-log switch on success and failure, and concurrent lifecycle operations no longer leave unmanaged listeners.',
                '文件、图片及检索工具拦截版本库目录的链接别名；MCP 成功与失败均遵守详情日志开关，并修复并发启停留下未受管理监听器的问题。',
                'Use the conversation bubble next to the health check on a Key card to test multiple turns with that Key. Supports Anthropic Messages, OpenAI Chat and OpenAI Responses, model selection, cancellation, latency and token usage.',
                '点击 Key 卡片健康检查旁的对话气泡，可用该 Key 测试多轮会话；支持 Anthropic Messages、OpenAI Chat、OpenAI Responses、模型选择、停止请求及耗时和 Token 用量展示。',
                'Conversation tests do not fail over to another Key or persist message bodies locally. Requests may consume provider credit; stopping a request does not guarantee that the provider stops billing.',
                '会话测试不会切换到其他 Key，对话正文不在本机持久保存。请求可能消耗上游额度，停止请求不保证上游停止计费。',
                'Conversation regressions use local mock providers. Real-provider conversations and cross-machine backup restores still require manual acceptance; dependency advisory triage is not complete.',
                '会话回归使用本地模拟上游；真实供应商会话及跨机备份恢复仍需人工验收，依赖公告核验尚未完成。',
                'Original backups and historical logs remain unchanged. A sanitized copy may still contain other sensitive data; revoke or rotate any tokens exposed through shared files.',
                '原备份与历史日志不会自动清理；移除明文 Token 的副本仍可能含其他敏感数据，曾通过分享文件泄露的 Token 必须撤销或轮换。',
                '',
                '---',
                '',
                '**Linux security update:** A master password is now required before saving or using API keys; fixed-key fallback has been removed.',
                'Back up secrets.enc before upgrading. Legacy fixed-key vaults are rejected without overwriting the original file. If affected, quit the app, move the old vault out of the data directory, restart, set a master password and re-enter your upstream keys. Rotate old keys and remove old backups after verifying the new vault.',
                'Linux 用户：升级前备份 secrets.enc。旧固定密钥库不会自动迁移；如遇拒绝读取，请退出后移出旧库、重启并设置主口令，再重新录入密钥，建议轮换旧密钥。',
                '',
                '**Already using SynaRoute?** In-app update works normally from v0.1.26 onward.',
                '',
                '**If you are on v0.1.23 or earlier**, in-app updates no longer work on your build:',
                'the update signing key was rotated, and the public key baked into those versions',
                'cannot verify newer signatures — it will keep failing verification or stay on the old',
                'version no matter how many times you retry. Install this release over your existing',
                'copy once and updates will work normally afterwards. Your settings, keys and usage',
                'history live in the system application-data directory and are not affected.',
              ].join('\n'),
              draft: true,
              prerelease: false
            })
            return data.id

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm ci

      - name: Linux vault security regression tests
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib secret::tests

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          includeUpdaterJson: false

      # ---- 产物门：在这里，而不是「发完再人工看一眼」 ----
      #
      # 这四步都是在 tauri-action **之后**跑，因为它们要检查的是它的输出。
      # 顺序有意：先查内容（快、无副作用），再执行产物（慢、有副作用）。

      # 判据来自 CLAUDE.md 的构建硬规则：dist chunk 名要能在 exe 里搜到（> 0）。
      # 裸 cargo build 的产物该值为 0 —— 那种 exe 装上去界面一片空白。
      # 此前这是条**人工**判据。
      - name: 前端已嵌入产物
        run: npm run check:embedded

      # 🔴 每个可更新产物都签过、且 keyid 与客户端内嵌的 pubkey 一致（**真验签**）。
      # 补的是 2026-08-31 的一次真实失败：本机构建的最后一行报「no private key」，
      # 而它上面是一长串成功输出 —— 没有 .sig 的包装得上，但 updater 会拒收，
      # 用户点「检查更新」永远收不到它。失效方向最坏：构建看起来是成功的。
      #
      # 只在 Windows 跑，理由同下面那条外泄审计：门的产物后缀清单是 Windows 的
      # （.msi / -setup.exe）。而「secret 配没配、配的是不是现役钥」这个真正要守的东西
      # 三个平台共用同一个环境变量 —— Windows 绿就证明了它。边界写在脚本模块注释里。
      - name: 更新签名有效且钥匙对得上
        if: matrix.platform == 'windows-latest'
        run: npm run check:signature

      # 外泄审计：运行数据 / 密钥 / 演示数据都不得进包。
      # 只在 Windows 跑 —— 它的判据是 NSIS 包与 windows exe 的路径（见脚本内常量）。
      - name: 发布物外泄审计
        if: matrix.platform == 'windows-latest'
        run: npm run audit:release

      # 🔴 真装真启动。CLAUDE.md 里「仍未验证：NSIS 安装器能否装成」挂了很久，
      # 而历史上静默安装卡死过两次 —— 也就是说交付给用户的那个包从未被任何流程执行过。
      # 只在 Windows 跑（NSIS 是 Windows 专属）。
      - name: 安装器冒烟（装得上 + 起得来）
        if: matrix.platform == 'windows-latest'
        run: npm run smoke:installer

  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    needs: [create-release, build-tauri]

    steps:
      - uses: actions/checkout@v4

      - name: assemble complete updater manifest
        uses: actions/github-script@v7
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const { pathToFileURL } = require('node:url')
            const { publishUpdaterManifest } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/lib/release-updater.mjs`).href)
            const { version } = require(`${process.env.GITHUB_WORKSPACE}/package.json`)
            const result = await publishUpdaterManifest({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              releaseId: Number(process.env.release_id),
              version
            })
            core.info(`Verified updater manifest with ${result.platformCount} platform entries.`)

      - name: publish release
        id: publish-release
        uses: actions/github-script@v7
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
              prerelease: false
            })
