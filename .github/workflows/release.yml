name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}

    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: get version
        run: echo "PACKAGE_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
      - name: create release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${process.env.PACKAGE_VERSION}`,
              name: `SynaRoute v${process.env.PACKAGE_VERSION}`,
              // 说明里必须带「v0.1.23 及更早请手动重装」那一段。
              // 官网下载页也有同样一条，但那两条渠道触达的是不同的人 ——
              // 从 Release 页直接下包的人根本不会经过官网。
              // 而这批用户是**收不到任何应用内更新**的（换钥导致旧公钥验不过新签名），
              // 也就永远看不到我们在新版里改好的那句错误文案。这是少数能触达他们的地方。
              body: [
                'Download the installer for your platform from the assets below.',
                '',
                '---',
                '',
                '**Already using SynaRoute?** In-app update works normally from v0.1.26 onward.',
                '',
                '**If you are on v0.1.23 or earlier**, in-app updates no longer work on your build:',
                'the update signing key was rotated, and the public key baked into those versions',
                'cannot verify newer signatures — it will keep failing verification or stay on the old',
                'version no matter how many times you retry. Install this release over your existing',
                'copy once and updates will work normally afterwards. Your settings, keys and usage',
                'history live in the system application-data directory and are not affected.',
              ].join('\n'),
              draft: true,
              prerelease: false
            })
            return data.id

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          includeUpdaterJson: true

      # ---- 产物门：在这里，而不是「发完再人工看一眼」 ----
      #
      # 这三步都是在 tauri-action **之后**跑，因为它们要检查的是它的输出。
      # 顺序有意：先查内容（快、无副作用），再执行产物（慢、有副作用）。

      # 判据来自 CLAUDE.md 的构建硬规则：dist chunk 名要能在 exe 里搜到（> 0）。
      # 裸 cargo build 的产物该值为 0 —— 那种 exe 装上去界面一片空白。
      # 此前这是条**人工**判据。
      - name: 前端已嵌入产物
        run: npm run check:embedded

      # 外泄审计：运行数据 / 密钥 / 演示数据都不得进包。
      # 只在 Windows 跑 —— 它的判据是 NSIS 包与 windows exe 的路径（见脚本内常量）。
      - name: 发布物外泄审计
        if: matrix.platform == 'windows-latest'
        run: npm run audit:release

      # 🔴 真装真启动。CLAUDE.md 里「仍未验证：NSIS 安装器能否装成」挂了很久，
      # 而历史上静默安装卡死过两次 —— 也就是说交付给用户的那个包从未被任何流程执行过。
      # 只在 Windows 跑（NSIS 是 Windows 专属）。
      - name: 安装器冒烟（装得上 + 起得来）
        if: matrix.platform == 'windows-latest'
        run: npm run smoke:installer

  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    needs: [create-release, build-tauri]

    steps:
      - name: publish release
        id: publish-release
        uses: actions/github-script@v7
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
              prerelease: false
            })
