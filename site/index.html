<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/logo-256.png" />
    <meta name="theme-color" content="#6D5EF7" />

    <!--
      这里的 title / description / OG 是**兜底**：站点是客户端渲染，
      按路由更新 meta 的逻辑在 useSeo 里。部分只读初始 HTML 的抓取器
      （某些社交平台的分享卡片）拿不到 JS 执行后的结果，故预置一份默认值，
      保证分享出去至少不是空白。
    -->
    <title>SynaRoute — Local AI routing with key failover and multi-model collaboration</title>
    <meta
      name="description"
      content="SynaRoute is a local API routing proxy for Claude CLI, Claude Desktop and Codex Desktop. Manage API keys and models across providers, automatically switch to a backup key on failure, and combine answers from multiple models. Keys are encrypted locally; no cloud account is required."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SynaRoute" />
    <meta property="og:title" content="SynaRoute — Local AI routing with key failover and multi-model collaboration" />
    <meta
      property="og:description"
      content="Manage API keys and models across providers for Claude CLI, Claude Desktop and Codex Desktop. Automatic key failover and multi-model collaboration, running locally."
    />
    <meta property="og:image" content="https://synaroute.mofamilys.com/og.png" />
    <meta property="og:url" content="https://synaroute.mofamilys.com/" />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // 在 React 挂载前先把主题类加上，避免深色偏好的用户看到一帧白屏。
      // 与 hooks/useTheme.ts 用同一个 storage key，改名要两处一起改。
      (function () {
        try {
          var saved = localStorage.getItem("synaroute-site-theme");
          var dark =
            saved === "dark" ||
            (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (e) {
          /* 隐私模式下 localStorage 可能抛异常，忽略即可 —— 大不了用浅色 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
