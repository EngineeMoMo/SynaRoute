[package]
name = "synaroute"
version = "0.1.10"
description = "SynaRoute - 智能 API Key 路由代理与配置管理"
authors = ["SynaRoute"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "synaroute_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# 开机自启动（FR-025）：注册系统级自启动项。Windows 走注册表 Run 键，跨平台由插件适配。
tauri-plugin-autostart = "2"

# 异步运行时 + HTTP
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
bytes = "1"
futures-util = "0.3"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# 读 cc-switch 的历史配置库（SQLite）以导入既有 Key。只读、绝不写回。
# bundled：自带 SQLite C 源码一起编，免去用户机器上装 sqlite3 运行库。
rusqlite = { version = "0.32", features = ["bundled"] }

# 加密：Windows 用 DPAPI；非 Windows 开发回退用 AES-GCM
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
# 口令派生（Argon2id）：配置导出的「含密钥」信封与主口令增强模式共用同一套 KDF。
# DPAPI 绑当前 Windows 账户，密文跨机解不出，故迁移场景必须走口令派生密钥。
argon2 = "0.5"
# 口令等敏感缓冲用后清零，减少内存残留窗口。
zeroize = { version = "1", features = ["zeroize_derive"] }
# 导出文件完整性校验（FR-021 验收要求「导入时校验版本与完整性」）。
sha2 = "0.10"

# 路径 / 时间 / 日志 / 错误
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
# Windows DPAPI 免口令加密
windows = { version = "0.58", features = [
  "Win32_Security_Cryptography",
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]
