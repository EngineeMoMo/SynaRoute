<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    SynaRoute 应用图标源图。改图标只改这一个文件，然后跑：
        npx @tauri-apps/cli icon src-tauri/app-icon.svg -o src-tauri/icons
    托盘的「已停止」灰度图标由运行时从这份图现场派生（见 lib.rs stopped_tray_icon），
    不需要另存一张灰色版 —— 那样换图标必然忘记同步。

    ## 设计来源与取舍（照用户给的参考图重绘，非直接嵌位图）

    参考图：左侧三个厂商圆标 → 折线汇入中间的大脑枢纽 → 右侧箭头输出。语义正是 SynaRoute
    做的事（多个上游 Key 汇聚 → 聚合决策 → 一个答案给客户端），故保留这条骨架。

    三处必要改动：

    1. **不画厂商 logo**。OpenAI / xAI / Anthropic 的标志是他人注册商标，放进本应用的安装包
       图标属未授权使用，也会让人误以为有官方合作。改用三个中性色点代表「多个上游」——
       颜色沿用参考图的青/白/橙，视觉记忆点保留。

    2. **按 32px 反推元素数量，不是按 1024px 好看来画**。图标的真实工作尺寸是 32px
       （托盘、任务栏）与 16px（标题栏）。第一版照搬了参考图的电路细纹 + 环绕回路箭头 +
       大脑双叶沟壑，在 1024px 下很像，缩到 32px 后这些 2~3px 的结构互相吞噬，只剩一团紫灰。
       故本版**删掉环绕箭头与内部纹理**，只留三样能在 32px 存活的东西：
       三个上游点、汇流线、一个实心枢纽（带中缝读作双叶）。

    3. **线宽与半径取能缩放的下限**：汇流线 stroke 30、上游点 r=56、枢纽 r=132。
       1024px 下略显粗壮是刻意的 —— 缩到 32px 恰好还剩 1px 左右的可见结构。

    圆角方块 + 四周留白透明：Windows 任务栏与开始菜单自己会做遮罩，源图带圆角保证两种呈现
    下都不出直角硬边；四角透明避免在浅色任务栏上糊成一块。
  -->
  <defs>
    <!-- 参考图的紫色渐变（左上偏亮 → 右下偏深），给图标一点体积感 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
  </defs>

  <!-- 圆角底板：四周留 56px 透明边，圆角 216（约 22%，接近 squircle 观感） -->
  <rect x="56" y="56" width="912" height="912" rx="216" ry="216" fill="url(#bg)"/>

  <!--
    三条汇流路径：左侧三个上游 → 折线汇入中枢。
    「横 → 圆角折 → 横」而非直斜线，呼应参考图那种电路板走线的感觉。
    不透明度 0.7：既退到主体之后，又不会在 32px 下淡到看不见（第一版 0.62 偏淡）。
  -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="30"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 300 H384 Q436 300 436 352 V460 Q436 512 488 512 H540"/>
    <path d="M300 512 H540"/>
    <path d="M300 724 H384 Q436 724 436 672 V564 Q436 512 488 512 H540"/>
  </g>

  <!-- 三个上游节点。颜色取自参考图的三个厂商圆标，但不含任何商标图形。 -->
  <g>
    <circle cx="248" cy="300" r="56" fill="#F8FAFC"/>
    <circle cx="248" cy="300" r="24" fill="#10A37F"/>

    <circle cx="248" cy="512" r="56" fill="#1C1C22"/>
    <circle cx="248" cy="512" r="24" fill="#F8FAFC"/>

    <circle cx="248" cy="724" r="56" fill="#F0A055"/>
    <circle cx="248" cy="724" r="24" fill="#FFFFFF"/>
  </g>

  <!--
    中央枢纽：实心白圆 + 一道中缝。
    为什么用实心而非轮廓：轮廓在 32px 下会与背景混成灰环；实心白是整张图里对比最强的块，
    缩放后最先被识别。中缝把它读作「双叶」（聚合决策的隐喻），且它是唯一保留的内部细节。
  -->
  <g transform="translate(672 512)">
    <circle r="132" fill="#FFFFFF"/>
    <!-- 中缝：用背景紫挖出，宽度 26 保证 32px 下仍是可见的一道，而非消失 -->
    <path d="M0 -108 V108" stroke="#6D28D9" stroke-width="26" stroke-linecap="round" fill="none"/>
    <!-- 左右各一个小圆点：暗示两侧各自的推理节点，同时打破纯圆的单调 -->
    <circle cx="-60" cy="0" r="22" fill="#6D28D9"/>
    <circle cx="60" cy="0" r="22" fill="#6D28D9"/>
  </g>

  <!-- 输出箭头：单一出口，表达「聚合后给客户端一个答案」。三角实心，比 stroke 更扛缩放。 -->
  <polygon points="836,452 940,512 836,572" fill="#FFFFFF"/>
</svg>
