<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430"><rect width="1200" height="430" rx="28" fill="#FAFAFA"/><text x="56" y="62" fill="#18181B" font-size="30" font-family="Segoe UI,Microsoft YaHei" font-weight="700">故障转移：失败才切换，不做轮询</text><g font-family="Segoe UI,Microsoft YaHei"><rect x="75" y="130" width="300" height="210" rx="18" fill="#FFF" stroke="#E4E4E7" stroke-width="3"/><text x="110" y="178" fill="#71717A" font-size="20">本次请求</text><text x="110" y="228" fill="#18181B" font-size="28" font-weight="700">主 Key → 备用 Key</text><text x="110" y="275" fill="#71717A" font-size="20">客户端不需要修改配置</text><rect x="505" y="105" width="260" height="90" rx="18" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="3"/><circle cx="550" cy="150" r="15" fill="#EF4444"/><text x="585" y="158" fill="#991B1B" font-size="25" font-weight="700">Key A 失败</text><text x="550" y="230" fill="#71717A" font-size="19">429 / 5xx / 超时</text><rect x="845" y="235" width="260" height="90" rx="18" fill="#F0FDF4" stroke="#86EFAC" stroke-width="3"/><circle cx="890" cy="280" r="15" fill="#22C55E"/><text x="925" y="288" fill="#166534" font-size="25" font-weight="700">Key B 成功</text></g><path d="M375 235 L485 155" stroke="#A1A1AA" stroke-width="5" fill="none"/><path d="M765 180 C815 205 820 240 830 270" stroke="#A1A1AA" stroke-width="5" fill="none"/><path d="M805 182 l-20 5 8 17" fill="#A1A1AA"/><path d="M820 268 l3 20 17-10" fill="#A1A1AA"/><text x="505" y="375" fill="#6D5EF7" font-size="22" font-family="Segoe UI,Microsoft YaHei" font-weight="700">多 Key 才能形成可用的备份链路</text></svg>